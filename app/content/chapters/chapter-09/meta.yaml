summary:
  ru: "Пятое задание: в теле отца-одиночки Мари ищет в поезде Милан — Цюрих будущего покойника. Душа машиниста сбегает, поезд срывается с моста — а из-под обломков Мари вытаскивает Архивариус, покинувший Архив ради её переписанной судьбы."
  en: "The fifth assignment: in a single father's body, Mari hunts for the soon-to-be-dead on the Milan–Zurich express. The driver's soul escapes, the train plunges off a bridge — and Mari is pulled from the wreck by the Archivist, who has left the Archive because of her rewritten fate."
