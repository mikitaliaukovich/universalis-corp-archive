id: mari
name: { ru: "Мари Доберштейн", en: "Mari Doberstein" }
role: { ru: "Главная героиня. Исполнитель поручений Харона", en: "Protagonist. Charon's task executor" }
summary:
  ru: "36-летняя юристка из Кракова, погибшая вместе с семьёй. В Чистилище заключает сделку: семь спасённых душ в обмен на Рай для мужа и сына — а по обещанию Харона и для себя самой."
  en: "A 36-year-old lawyer from Kraków who died along with her family. In Purgatory she strikes a deal: seven saved souls in exchange for Paradise for her husband and son — and, as Charon promises, for herself."
status: dead
stamp: { ru: "Мертва", en: "Deceased" }
faction: protagonists
firstChapter: 1
order: 1
clearance: open
quote:
  ru: "«Иногда, чтобы найти себя, нужно потерять всё, во что ты верила.»"
  en: "“Sometimes, to find yourself, you have to lose everything you believed in.”"
reference:
  ru: "Джульет Николс (Ребекка Фергюсон), сериал «Укрытие»"
