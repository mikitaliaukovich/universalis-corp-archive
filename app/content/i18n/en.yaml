games.hack.name: "Terminal access"
games.hack.blurb: "A locked service terminal. Its memory dump holds the password among words of the same length. Every wrong guess reports how many letters stand in the right place. A bracket pair on one line — () [] {} <> — removes a dud or restores the attempts."
