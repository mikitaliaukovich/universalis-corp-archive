games.tube.name: "Pneumatic mail"
games.tube.blurb: "Lay the tube through the sorting hall and pick up every capsule. Each capsule makes the tube longer and the air faster. Don't hit the walls or your own pipe."
games.tube.over: "Tube jammed"

games.redact.name: "Redaction"
games.redact.blurb: "A case file arrives with its secrets scattered through the text. Uncover the safe passages; each number tells how many secrets touch that spot. Black out every secret before the press does."
games.redact.win: "Declassified"
games.redact.over: "Leak"

games.shelf.name: "Archive shelving"
games.shelf.blurb: "Folders of fates descend on the Archive's shelves. Fill a shelf from wall to wall and it is sent to storage. When the stack reaches the ceiling, the Archive is full."
