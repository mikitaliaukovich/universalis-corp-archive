games.redact.name: "Цензура"
games.redact.blurb: "Пришло дело, и секреты рассыпаны по всему тексту. Открывайте безопасные места; число показывает, сколько секретов касается этой клетки. Закройте каждый секрет плашкой, пока его не прочла пресса."
