    label: { ru: "Чистилище", en: "Purgatory" }
  archive:
    code: "АРХ"
    label: { ru: "Архив", en: "The Archive" }

chapterStatuses:
  written:
    label: { ru: "Написана", en: "Written" }
    stamp: { ru: "Копия верна", en: "Certified copy" }
  partial:
    label: { ru: "Частично написана", en: "Partially written" }
    stamp: { ru: "В работе", en: "In progress" }
  outline:
    label: { ru: "Черновой план", en: "Outline only" }
    stamp: { ru: "Черновик", en: "Draft" }

characterStatuses:
  dead:
    label: { ru: "Мёртв(а)", en: "Deceased" }
    stamp: { ru: "Мёртв", en: "Deceased" }
  immortal:
    label: { ru: "Бессмертен", en: "Immortal" }
    stamp: { ru: "Бессмертен", en: "Immortal" }
  alive:
    label: { ru: "Жив(а)", en: "Alive" }
    stamp: { ru: "Жив", en: "Alive" }
