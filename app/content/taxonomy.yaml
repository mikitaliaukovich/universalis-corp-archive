factions:
  - id: protagonists
    label: { ru: "Семья Доберштейн", en: "The Doberstein family" }
    description:
      ru: "Мари и те, кого она потеряла. Семья, ради которой заключена сделка."
      en: "Mari and those she lost — the family the deal was made for."
  - id: administration
    label: { ru: "Администрация Чистилища", en: "Purgatory Administration" }
    description:
      ru: "Официальная система Корпорации Универсалис: менеджеры, писари и сущности старше человечества."
      en: "The official system of the Universalis Corporation: managers, scribes and entities older than mankind."
  - id: opposition
    label: { ru: "Фракция Харона", en: "Charon's faction" }
    description:
      ru: "Понижённые реформой. Собственная игра, собственные цели."
      en: "Those demoted by the reform. Their own game, their own goals."
  - id: staff
    label: { ru: "Персонал", en: "Staff" }
    description:
      ru: "Бегунки, приёмщики и архивариусы — души, отрабатывающие грехи трудом."
      en: "Runners, clerks and archivists — souls working off their sins."
  - id: living
    label: { ru: "Мир живых", en: "The living world" }
    description:
      ru: "Люди, чьи пути пересеклись с Мари — до и после её смерти."
      en: "People whose paths crossed Mari's — before and after her death."

